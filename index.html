<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Conversor de Moedas</title>

</head>

<body>
    <section>
        <div class="box-1">
            <label for="moeda">Converter <b>de:</b></label>

            <select class="moeda-base">
                <option>-- Selecione uma moeda --</option>
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="libra">£ Libra</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Bitcoin</option>

            </select>

        </div>

        <div class="box-2">
            <label for="moeda">Converter <b>para:</b></label>

            <select class="moeda-destino">
                <option>-- Selecione uma moeda --</option>
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="libra">£ Libra</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Bitcoin</option>

            </select>

        </div>

        <div class="box-3">
            <label>Valor:</label>

            <input class="currency" placeholder="Digite um valor">

        </div>

        <button class="convert-button">Converter</button>

        <div class="box-4">
            <div class="moeda-original">
                <img src="./img/brasil 2.png" alt="Bandeira-do-Brasil" class="flag">

                <p class="conversor">Real</p>

                <h2 class="valorParaConverter">R$ 4,97</h2>

            </div>

            <img src="./img/Vector.png" alt="Icone">

            <div class="moeda-destino">
                <img src="./img/estados-unidos (1) 1.png" alt="Bandeira-do-EUA" class="flag">

                <p class="conversor">Dólar Americano</p>

                <h2 class="valorConvertido">R$ 1,00</h2>

            </div>

        </div>

    </section>

</body>

<script src="./script.js"></script>

</html>
