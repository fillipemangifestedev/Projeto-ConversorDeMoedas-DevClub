<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Conversor de Moedas</title>
</head>

<body>
    <section>
        <div class="box-1">
            <h3>Converter <b>de:</b></h3>

            <input onkeypress="" placeholder="R$ Real Brasileiro">

        </div>

        <div class="box-2">
            <h3>Converter <b>para:</b></h3>

            <input placeholder="US$ Dólas ameriano">

        </div>

        <div class="box-3">
            <h3>Valor:</h3>

            <input placeholder="R$ 10.000,00">

        </div>

        <button onclick="">Converter</button>

        <div class="box-4">
            <img src="./img/brasil 2.png" alt="Bandeira-do-Brasil">

            <h3 class="moeda">Real</h3>
            <h2>R$ 10,000,00</h2>

            <img src="./img/Vector.png" alt="Icone">

            <img src="./img/estados-unidos (1) 1.png" alt="Bandeira-do-EUA">

            <h3 class="moeda">Dólar Americano</h3>
            <h2>R$ 1,995,17</h2>
        </div>
    </section>

</body>

<script src="./script.js"></script>

</html>
